# ---------------------------------------------------------------
# Trading bot settings. Edit these, then commit/redeploy.
# ---------------------------------------------------------------

# Stocks/ETFs the bot watches. This is an EXAMPLE list of large,
# heavily traded names, not a recommendation. Swap in your own.
symbols:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - AVGO
  - AMD
  - NFLX
  - JPM
  - LLY
  - COST
  - PLTR
  - UBER
  - SMH
  - QQQ
  - IWM
  - XLE
  - GLD

strategy:
  name: breakout            # "breakout" or "ma_crossover"

  # breakout: buy when the price closes at a new high for this many trading days
  # (252 = 52 weeks), sell when it closes below its lowest close of the last exit_days.
  lookback_days: 252
  exit_days: 50

  # ma_crossover settings (only used if name: ma_crossover)
  short_window: 20
  long_window: 50

# Core: buy-and-hold slice the bot keeps invested and NEVER sells.
core:
  symbol: SPY
  dollars: 1500
  top_up_below_pct: 5

# Safety limits
risk:
  dollars_per_position: 300      # how much to buy on each breakout
  max_positions: 5               # most stocks held at once
  max_total_invested: 1500       # bot never holds more than this in total
  stop_loss_pct: 7               # sell if a position falls this % below what you paid (0 = off)

# Paper trading (simulated money). To trade real money you must set
# this to false AND set the environment variable ALPACA_LIVE_CONFIRM=yes.
paper: true

# true = log what the bot WOULD do, but place no orders at all.
dry_run: false
