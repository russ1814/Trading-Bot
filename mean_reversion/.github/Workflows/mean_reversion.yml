name: Mean Reversion Bot

on:
  schedule:
    # Two times so one always lands ~30 min before the 4pm ET close,
    # whether it's daylight time (19:30 UTC) or standard time (20:30 UTC).
    # The bot exits on its own if it's not near the close.
    - cron: "30 19 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log trades without placing them"
        type: boolean
        default: true
      force_run:
        description: "Ignore the near-close time window"
        type: boolean
        default: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r mean_reversion/requirements.txt
      - run: python mean_reversion/mean_reversion_bot.py
        env:
          ALPACA_MR_API_KEY: ${{ secrets.ALPACA_MR_API_KEY }}
          ALPACA_MR_SECRET_KEY: ${{ secrets.ALPACA_MR_SECRET_KEY }}
          ALPACA_PAPER: "true"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
